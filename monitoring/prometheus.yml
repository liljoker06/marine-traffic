global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métriques Django (nécessite django-prometheus installé)
  - job_name: django
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics

  # Métriques Redis via redis_exporter
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # Métriques Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
