{% load static %}
<!-- ── PANNEAU DROIT ───────────────────────────────────────────────────────── -->
<div x-data="detailPanel()"
     @open-port-detail.window="openPort($event.detail)"
     @open-ship-detail.window="openShip($event.detail)"
     class="absolute right-0 top-0 bottom-0 z-40 flex flex-row-reverse">

    <div class="h-full bg-gray-900/95 backdrop-blur-sm shadow-2xl flex flex-col transition-all duration-300 overflow-hidden"
         :class="open ? 'w-80 border-l border-gray-700' : 'w-0'">

        <!-- En-tête -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700 flex-shrink-0 min-w-0">
            <div class="min-w-0 pr-3">
                <h2 class="text-white font-semibold text-sm truncate" x-text="title"></h2>
                <p class="text-xs text-gray-400 truncate mt-0.5" x-text="subtitle"></p>
            </div>
            <button @click="close()" class="text-gray-400 hover:text-white transition flex-shrink-0 p-1 rounded hover:bg-gray-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Détail Port -->
        <div class="panel-scroll flex-1 overflow-y-auto" x-show="type==='port' && data">
            <div class="p-4 border-b border-gray-800">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-semibold">Informations</p>
                <div class="flex flex-col gap-2 text-sm">
                    <div x-show="data?.harbor_size" class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">⚓</span>
                        <span class="text-xs px-2 py-0.5 rounded-full font-semibold"
                              :class="{ 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30': data?.harbor_size==='L', 'bg-orange-500/20 text-orange-400 border border-orange-500/30': data?.harbor_size==='M', 'bg-blue-500/20 text-blue-400 border border-blue-500/30': data?.harbor_size==='S'||data?.harbor_size==='V' }"
                              x-text="({L:'Grand port',M:'Port moyen',S:'Petit port',V:'Très petit port'})[data?.harbor_size]"></span>
                    </div>
                    <div class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">🏳️</span><span x-text="data?.country||'—'"></span>
                    </div>
                    <div x-show="data?.region" class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">🌍</span><span x-text="data?.region"></span>
                    </div>
                    <div class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">📍</span>
                        <span class="text-xs font-mono text-gray-400"
                              x-text="data ? data.latitude.toFixed(4)+', '+data.longitude.toFixed(4) : ''"></span>
                    </div>
                </div>
            </div>
            <div class="p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-semibold flex items-center gap-2">
                    Wikipedia
                    <span x-show="wikiLoading" class="w-3 h-3 border-2 border-gray-600 border-t-blue-400 rounded-full animate-spin"></span>
                </p>
                <div x-show="!wikiLoading && !wikiData && wikiSearched" class="text-center py-8">
                    <div class="text-3xl mb-2">🔍</div>
                    <p class="text-sm text-gray-500">Aucune information trouvée.</p>
                </div>
                <div x-show="!wikiLoading && wikiData" class="flex flex-col gap-3">
                    <div x-show="wikiData?.thumbnail?.source" class="rounded-xl overflow-hidden border border-gray-700">
                        <img :src="wikiData?.thumbnail?.source" :alt="data?.name" class="w-full h-44 object-cover" />
                    </div>
                    <p class="text-sm text-gray-300 leading-relaxed" x-text="wikiData?.extract"></p>
                    <a x-show="wikiData?.content_urls?.desktop?.page" :href="wikiData?.content_urls?.desktop?.page"
                       target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-1.5 text-xs text-blue-400 hover:text-blue-300 transition">
                        Lire l'article complet
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- Détail Navire -->
        <div class="panel-scroll flex-1 overflow-y-auto" x-show="type==='ship' && data">

            <!-- Photo du navire -->
            <div class="relative">
                <!-- Photo Wikipedia si disponible -->
                <template x-if="shipPhoto">
                    <img :src="shipPhoto" :alt="data?.name"
                         class="w-full h-40 object-cover border-b border-gray-700" />
                </template>
                <!-- Placeholder + lien Google Images si pas de photo -->
                <template x-if="!shipPhoto && !shipPhotoLoading">
                    <div class="w-full h-28 flex flex-col items-center justify-center gap-2 border-b border-gray-800 bg-gray-900/60">
                        <div class="text-3xl"
                             x-text="(()=>{ const t=data?.ship_type??data?.type; if(!t) return '🚢'; if(t>=70&&t<80) return '📦'; if(t>=80&&t<90) return '🛢️'; if(t>=60&&t<70) return '🛳️'; if(t>=30&&t<36) return '🎣'; return '🚢'; })()">
                        </div>
                        <a :href="`https://www.google.com/search?q=${encodeURIComponent((data?.name||'ship')+' ship vessel')}&tbm=isch`"
                           target="_blank" rel="noopener noreferrer"
                           class="flex items-center gap-1.5 text-xs text-blue-400 hover:text-blue-300 transition">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            Rechercher une photo
                        </a>
                    </div>
                </template>
                <!-- Spinner pendant le chargement -->
                <template x-if="shipPhotoLoading">
                    <div class="w-full h-28 bg-gray-900 border-b border-gray-800 flex items-center justify-center">
                        <span class="w-5 h-5 border-2 border-gray-600 border-t-blue-400 rounded-full animate-spin"></span>
                    </div>
                </template>
            </div>

            <div class="p-4 border-b border-gray-800">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-semibold">Informations AIS</p>
                <div class="flex flex-col gap-2 text-sm">
                    <div class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">📡</span>
                        <span class="font-mono text-xs text-gray-400" x-text="'MMSI : '+(data?.mmsi||'—')"></span>
                    </div>
                    <div class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">🚢</span><span x-text="data?.type_label||'Type inconnu'"></span>
                    </div>
                    <div class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">⚓</span><span x-text="data?.status_label||'—'"></span>
                    </div>
                    <div class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">💨</span>
                        <span x-text="data?.speed != null ? data.speed.toFixed(1)+' nœuds' : '—'"></span>
                    </div>
                    <div class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">🧭</span>
                        <span x-text="data?.course != null ? data.course.toFixed(1)+'°' : '—'"></span>
                    </div>
                    <div class="flex items-center gap-2.5 text-gray-300">
                        <span class="text-gray-500">📍</span>
                        <span class="text-xs font-mono text-gray-400"
                              x-text="data ? (data.lat??data.latitude??0).toFixed(4)+', '+(data.lng??data.longitude??0).toFixed(4) : ''"></span>
                    </div>
                </div>
            </div>
            <div class="p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-semibold flex items-center gap-2">
                    Route récente
                    <span x-show="trackLoading" class="w-3 h-3 border-2 border-gray-600 border-t-blue-400 rounded-full animate-spin"></span>
                </p>
                <div x-show="!trackLoading && trackPoints===0" class="text-center py-4">
                    <p class="text-xs text-gray-500">Pas encore de données de route.</p>
                </div>
                <div x-show="!trackLoading && trackPoints>0" class="text-xs text-gray-400 flex items-center gap-2">
                    <span class="w-6 h-1 bg-blue-400 rounded inline-block"></span>
                    <span x-text="trackPoints+' positions tracées'"></span>
                </div>
            </div>
        </div>

    </div>
</div>
