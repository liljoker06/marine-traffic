<nav class="bg-gray-900 border-b border-gray-800 shadow-lg relative z-50">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">

        <!-- Logo -->
        <a href="{% url 'index' %}" class="flex items-center gap-2 text-white font-bold text-xl">
            🚢 <span class="text-blue-400">Marine</span>Traffic
        </a>

        <!-- Navigation Links -->
        <ul class="hidden md:flex items-center gap-6 text-gray-300 text-sm font-medium">
            <li><a href="{% url 'index' %}" class="hover:text-blue-400 transition">Accueil</a></li>
            <li><a href="{% url 'map' %}" class="hover:text-blue-400 transition">Carte</a></li>
            <li><a href="#" class="hover:text-blue-400 transition">Navires</a></li>
            <li><a href="#" class="hover:text-blue-400 transition">Ports</a></li>
        </ul>

        <!-- Auth Actions -->
        <div class="flex items-center gap-3">
            {% if user.is_authenticated %}

                <!-- Dropdown utilisateur -->
                <div class="relative" x-data="{ open: false }">

                    <!-- Bouton avatar -->
                    <button @click="open = !open" @keydown.escape="open = false"
                            class="flex items-center gap-2 focus:outline-none group">
                        <div class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-sm font-bold text-white select-none group-hover:bg-blue-500 transition">
                            {{ user.username|first|upper }}
                        </div>
                        <!-- Chevron -->
                        <svg class="w-4 h-4 text-gray-400 transition-transform duration-200"
                             :class="{ 'rotate-180': open }"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <!-- Menu déroulant -->
                    <div x-show="open"
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="opacity-0 scale-95"
                         x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="opacity-100 scale-100"
                         x-transition:leave-end="opacity-0 scale-95"
                         @click.outside="open = false"
                         class="absolute right-0 mt-2 w-52 bg-gray-800 border border-gray-700 rounded-xl shadow-xl py-1"
                         style="display: none;">

                        <!-- Header -->
                        <div class="px-4 py-3 border-b border-gray-700">
                            <p class="text-white font-medium text-sm truncate">{{ user.username }}</p>
                            <p class="text-gray-400 text-xs truncate">{{ user.email }}</p>
                        </div>

                        <!-- Liens -->
                        <a href="{% url 'profile' %}"
                           class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-gray-700 hover:text-white transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            Mon profil
                        </a>

                        <a href="{% url 'edit_profile' %}"
                           class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-300 hover:bg-gray-700 hover:text-white transition"
                           @click="open = false">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                            Modifier le profil
                        </a>

                        <div class="border-t border-gray-700 my-1"></div>

                        <!-- Déconnexion -->
                        <form method="POST" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit"
                                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-400 hover:bg-gray-700 hover:text-red-300 transition text-left">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                                </svg>
                                Déconnexion
                            </button>
                        </form>

                    </div>
                </div>

            {% else %}
                <a href="{% url 'login' %}" class="text-sm text-gray-300 hover:text-white transition">
                    Connexion
                </a>
                <a href="{% url 'register' %}"
                    class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg transition">
                    S'inscrire
                </a>
            {% endif %}
        </div>

    </div>
</nav>
