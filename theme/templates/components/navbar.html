<nav class="bg-gray-900 border-b border-gray-800 shadow-lg">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">

        <!-- Logo -->
        <a href="/" class="flex items-center gap-2 text-white font-bold text-xl">
            🚢 <span class="text-blue-400">Marine</span>Traffic
        </a>

        <!-- Navigation Links -->
        <ul class="hidden md:flex items-center gap-6 text-gray-300 text-sm font-medium">
            <li><a href="/" class="hover:text-blue-400 transition">Accueil</a></li>
            <li><a href="/map/" class="hover:text-blue-400 transition">Carte</a></li>
            <li><a href="#" class="hover:text-blue-400 transition">Navires</a></li>
            <li><a href="#" class="hover:text-blue-400 transition">Ports</a></li>
        </ul>

        <!-- Auth Actions -->
        <div class="flex items-center gap-3">
            {% if user.is_authenticated %}
                <span class="text-sm text-gray-400">
                    Bonjour, <span class="text-blue-400 font-medium">{{ user.username }}</span>
                </span>
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit"
                        class="text-sm text-gray-300 hover:text-red-400 transition">
                        Déconnexion
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="text-sm text-gray-300 hover:text-white transition">
                    Connexion
                </a>
                <a href="{% url 'register' %}"
                    class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg transition">
                    S'inscrire
                </a>
            {% endif %}
        </div>

    </div>
</nav>
