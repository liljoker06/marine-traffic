{% load static %}
<!-- ── PANNEAU GAUCHE ─────────────────────────────────────────────────────── -->
<div x-data="mapPanel()" class="absolute left-0 top-0 bottom-0 z-40 flex">

    <div class="h-full bg-gray-900/95 backdrop-blur-sm shadow-2xl flex flex-col transition-all duration-300 overflow-hidden"
         :class="open ? 'w-72 border-r border-gray-700' : 'w-0'">

        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700 flex-shrink-0">
            <span class="text-white font-semibold text-sm whitespace-nowrap">🗺️ Paramètres</span>
            <span class="text-xs text-green-400 flex items-center gap-1.5 whitespace-nowrap">
                <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span>En direct
            </span>
        </div>

        <div class="panel-scroll flex-1 overflow-y-auto divide-y divide-gray-800">

            <!-- Recherche port -->
            <div class="p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-2.5 font-semibold">Recherche de port</p>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500 pointer-events-none"
                         fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" x-model="searchQuery"
                           @input.debounce.300ms="searchPorts()"
                           @keydown.escape="searchQuery=''; searchResults=[]"
                           placeholder="Nom du port..."
                           class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-9 pr-8 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
                    <button x-show="searchQuery" @click="searchQuery=''; searchResults=[]"
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div x-show="searching" class="mt-2 text-center py-2">
                    <span class="text-xs text-gray-500">Recherche...</span>
                </div>
                <div x-show="!searching && searchResults.length > 0"
                     class="mt-2 bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
                    <div class="max-h-48 overflow-y-auto">
                        <template x-for="port in searchResults" :key="port.id">
                            <button @click="flyToPort(port)"
                                    class="w-full text-left px-3 py-2.5 hover:bg-gray-700 border-b border-gray-700/50 last:border-b-0 transition">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs px-1.5 py-0.5 rounded font-bold flex-shrink-0"
                                          :class="{ 'bg-yellow-500/20 text-yellow-400': port.harbor_size==='L', 'bg-orange-500/20 text-orange-400': port.harbor_size==='M', 'bg-blue-500/20 text-blue-400': port.harbor_size==='S'||port.harbor_size==='V' }"
                                          x-text="port.harbor_size||'?'"></span>
                                    <span class="text-sm text-white font-medium truncate" x-text="port.name"></span>
                                </div>
                                <div class="text-xs text-gray-400 mt-0.5 pl-7 truncate"
                                     x-text="[port.country, port.region].filter(Boolean).join(' · ')"></div>
                            </button>
                        </template>
                    </div>
                </div>
                <div x-show="!searching && searchResults.length===0 && searchQuery.length>=2"
                     class="mt-2 text-center py-2">
                    <span class="text-xs text-gray-500">Aucun port trouvé</span>
                </div>
            </div>

            <!-- Filtres navires -->
            <div class="p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-semibold flex items-center justify-between">
                    <span>Filtres navires</span>
                    <span class="text-blue-400 font-bold" x-text="shipCount + ' visibles'"></span>
                </p>
                <div class="flex flex-col gap-2">
                    <input type="text" x-model="shipFilter.name" @input="applyShipFilters()"
                           placeholder="Nom du navire..."
                           class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
                    <select x-model="shipFilter.type" @change="applyShipFilters()"
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-blue-500 transition">
                        <option value="">Tous les types</option>
                        <option value="cargo">Cargo</option>
                        <option value="tanker">Tanker</option>
                        <option value="passenger">Passagers</option>
                        <option value="fishing">Pêche</option>
                        <option value="other">Autre</option>
                    </select>
                    <select x-model="shipFilter.status" @change="applyShipFilters()"
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-blue-500 transition">
                        <option value="">Tous les statuts</option>
                        <option value="0">En route</option>
                        <option value="1">Au mouillage</option>
                        <option value="5">À quai</option>
                    </select>
                </div>
            </div>

            <!-- Fond de carte -->
            <div class="p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-semibold">Fond de carte</p>
                <div class="flex flex-col gap-1">
                    <template x-for="layer in layers" :key="layer.id">
                        <label class="flex items-center gap-3 cursor-pointer group p-2 rounded-lg hover:bg-gray-800 transition">
                            <input type="radio" name="tileLayer" :value="layer.id" x-model="activeLayer"
                                   @change="switchLayer(layer.id)" class="accent-blue-500 flex-shrink-0" />
                            <div class="w-8 h-5 rounded border border-gray-600 flex-shrink-0" :style="'background:'+layer.color"></div>
                            <div class="min-w-0">
                                <div class="text-sm text-gray-300 group-hover:text-white transition" x-text="layer.label"></div>
                                <div class="text-xs text-gray-500" x-text="layer.desc"></div>
                            </div>
                        </label>
                    </template>
                </div>
            </div>

            <!-- Couches -->
            <div class="p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-semibold">Couches</p>
                <div class="flex flex-col gap-2">
                    <label class="flex items-center justify-between cursor-pointer p-2 rounded-lg hover:bg-gray-800 transition">
                        <span class="text-sm text-gray-300">⚓ Ports</span>
                        <input type="checkbox" checked @change="$event.target.checked ? showPorts() : hidePorts()"
                               class="accent-yellow-400 w-4 h-4 cursor-pointer" />
                    </label>
                    <label class="flex items-center justify-between cursor-pointer p-2 rounded-lg hover:bg-gray-800 transition">
                        <span class="text-sm text-gray-300">🚢 Navires</span>
                        <input type="checkbox" checked @change="$event.target.checked ? showShips() : hideShips()"
                               class="accent-blue-400 w-4 h-4 cursor-pointer" />
                    </label>
                    <label class="flex items-center justify-between cursor-pointer p-2 rounded-lg hover:bg-gray-800 transition">
                        <span class="text-sm text-gray-300">🔴 Congestion</span>
                        <input type="checkbox" checked @change="$event.target.checked ? showCongestion() : hideCongestion()"
                               class="accent-red-400 w-4 h-4 cursor-pointer" />
                    </label>
                </div>
            </div>

            <!-- Légende -->
            <div class="p-4">
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-3 font-semibold">Légende</p>
                <div class="flex flex-col gap-2 text-sm text-gray-300">
                    <div class="flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-yellow-400 border-2 border-yellow-600 flex-shrink-0"></span> Grand port (L)</div>
                    <div class="flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-orange-400 border border-orange-600 flex-shrink-0"></span> Port moyen (M)</div>
                    <div class="flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-green-400 flex-shrink-0"></span> Cargo</div>
                    <div class="flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-red-400 flex-shrink-0"></span> Tanker</div>
                    <div class="flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-purple-400 flex-shrink-0"></span> Passagers</div>
                    <div class="flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-orange-400 flex-shrink-0"></span> Pêche</div>
                    <div class="flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-gray-400 flex-shrink-0"></span> À quai / mouillage</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bouton toggle -->
    <button @click="open = !open"
            class="self-start mt-16 bg-gray-800/90 hover:bg-gray-700 border border-gray-700 rounded-r-lg px-1.5 py-3 text-gray-400 hover:text-white transition-colors shadow-lg flex-shrink-0"
            :class="open ? 'border-l-0' : ''">
        <svg class="w-4 h-4 transition-transform duration-300" :class="{ 'rotate-180': !open }"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
    </button>
</div>
